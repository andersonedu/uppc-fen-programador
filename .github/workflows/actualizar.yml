name: Actualizar UPPC FEN
on:
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
        description: Consultar también todas las fuentes directas
      ciam:
        type: boolean
        default: false
        description: Comprobar si cambió el directorio
permissions:
  contents: read
concurrency:
  group: uppc-fen-collector
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UPPC_APP_URL: ${{ secrets.UPPC_APP_URL }}
      UPPC_INGEST_TOKEN: ${{ secrets.UPPC_INGEST_TOKEN }}
      UPPC_VAPID_PRIVATE: ${{ secrets.UPPC_VAPID_PRIVATE }}
      UPPC_VAPID_SUBJECT: ${{ secrets.UPPC_APP_URL }}
      UPPC_SOURCE_INTERVAL: '900'
      UPPC_FULL_REFRESH: ${{ inputs.full }}
      UPPC_SYNC_CIAM: ${{ inputs.ciam }}
      UPPC_CACHE_KEY: ${{ secrets.UPPC_CACHE_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Ocultar el dominio del aplicativo en los registros
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          host = urlsplit(os.environ['UPPC_APP_URL']).hostname
          if not host:
              raise SystemExit('Falta configurar la dirección del aplicativo.')
          print('::add-mask::' + host)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.UPPC_COLLECTOR_REPO }}
          ssh-key: ${{ secrets.UPPC_COLLECTOR_DEPLOY_KEY }}
          ref: main
          path: collector
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: collector/runner-cache.enc
          key: uppc-cache-v1-${{ github.run_id }}
          restore-keys: uppc-cache-v1-
      - run: python -m pip install -r collector/site_source/requirements.txt
      - run: python collector/sealed_cache.py restore
      - run: python collector/collect_cloud.py
      - run: python collector/sealed_cache.py save
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: collector/runner-cache.enc
          key: uppc-cache-v1-${{ github.run_id }}
